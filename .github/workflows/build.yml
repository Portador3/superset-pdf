name: build

# 1) Compila el motor de gráficos (graficos.js) con los plugins de la versión de Superset indicada
#    → artifact "graficos-<versión>".
# 2) Construye la imagen del servicio, la prueba (PDF sintético + API) y, solo en main, la publica en GHCR
#    como <versión de Superset>, <versión>-<commit> y latest.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Debe coincidir con la versión del servidor Superset donde se usará.
  SUPERSET_VERSION: "6.1.0"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graficos:
    name: Compilar graficos.js
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Código de este repo
        uses: actions/checkout@v5
        with:
          path: superset-pdf

      - name: Superset ${{ env.SUPERSET_VERSION }} (solo superset-frontend)
        uses: actions/checkout@v5
        with:
          repository: apache/superset
          ref: ${{ env.SUPERSET_VERSION }}
          path: superset
          fetch-depth: 1
          sparse-checkout: superset-frontend

      - name: Node (versión de .nvmrc de Superset)
        uses: actions/setup-node@v5
        with:
          node-version-file: superset/superset-frontend/.nvmrc
          cache: npm
          cache-dependency-path: superset/superset-frontend/package-lock.json

      - name: Dependencias de superset-frontend
        working-directory: superset/superset-frontend
        run: npm ci --no-audit --no-fund

      - name: Copiar el motor dentro de superset-frontend
        run: |
          mkdir -p superset/superset-frontend/pdf
          cp -r superset-pdf/src/. superset/superset-frontend/pdf/
          cp superset-pdf/build/webpack.pdf.js superset/superset-frontend/webpack.pdf.js

      - name: Compilar
        working-directory: superset/superset-frontend
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=8192
          PDF_OUT: ${{ github.workspace }}/dist
          CI: "true"
        run: npx webpack --config webpack.pdf.js --mode production

      - name: Resumen
        run: |
          echo "${SUPERSET_VERSION}" > dist/SUPERSET_VERSION
          ls -la dist dist/assets || true
          {
            echo "### graficos.js para Superset ${SUPERSET_VERSION}"
            echo '```'
            du -ah dist | sort -h | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar artifact
        uses: actions/upload-artifact@v5
        with:
          name: graficos-${{ env.SUPERSET_VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  imagen:
    name: Imagen del servicio
    needs: graficos
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: graficos.js de este commit
        uses: actions/download-artifact@v5
        with:
          name: graficos-${{ env.SUPERSET_VERSION }}
          path: dist

      - uses: docker/setup-buildx-action@v3

      - name: Construir (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: superset-pdf:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prueba sintética (sin Superset)
        run: |
          docker run --name prueba superset-pdf:ci node pruebas/sintetica.mjs /tmp/prueba-sintetica.pdf
          docker cp prueba:/tmp/prueba-sintetica.pdf .
          docker rm prueba

      - name: Prueba de la API
        run: |
          docker run -d --name api -p 8080:8080 -e SUPERSET_URL=http://127.0.0.1:9 superset-pdf:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/salud && break; sleep 1; done
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/pdf -d '{}')" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/pdf -d '{"dashboard_id":1,"token":"token-de-prueba"}')" = 502
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/otra)" = 404
          docker logs api
          docker rm -f api

      - name: PDF de la prueba
        uses: actions/upload-artifact@v5
        with:
          name: prueba-sintetica
          path: prueba-sintetica.pdf
          retention-days: 14

      - name: Publicar en GHCR (solo main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGEN="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/superset-pdf"
          CORTO="$(git rev-parse --short=7 HEAD)"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for t in "$SUPERSET_VERSION" "$SUPERSET_VERSION-$CORTO" latest; do
            docker tag superset-pdf:ci "$IMAGEN:$t"
            docker push "$IMAGEN:$t"
          done
          echo "Publicada: $IMAGEN:{$SUPERSET_VERSION,$SUPERSET_VERSION-$CORTO,latest}" >> "$GITHUB_STEP_SUMMARY"
